<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Penugasan Employee</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="login-screen" class="screen-container">
    <div class="login-card">
      <h2>Sistem Penugasan Operator</h2>
      <p>Masukkan Token Akses Anda</p>
      <form id="login-form">
        <input type="text" id="token-input" placeholder="Contoh: GSQ6725" required>
        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-screen" class="screen-container hidden">
    <header class="topbar">
      <div class="user-info">
        <span id="user-name-display"></span>
        <span id="user-role-badge" class="badge"></span>
      </div>
      <button id="logout-btn" class="btn btn-secondary btn-sm">Keluar</button>
    </header>

    <main class="view-container">
      <div id="wo-list-container" class="card-list">
        <p class="loading-text">Memuat data penugasan...</p>
      </div>
    </main>
  </div>

  <script src="../js/supabase-client.js"></script>
  <script src="../js/employee.js"></script>
</body>
</html>
